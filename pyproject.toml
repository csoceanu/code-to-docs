[project]
name = "code-to-docs"
version = "1.0.0"
description = "GitHub Action that generates documentation suggestions from code changes using LLMs"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "openai",
    "mcp",
    "mcp-atlassian",
    "markdown",
    "docutils",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E402"]
"src/**" = ["E501", "E402"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 60
show_missing = true
